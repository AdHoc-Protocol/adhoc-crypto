name: release

# adhoc-crypto: BoringSSL and the code of src/, for every platform BoringSSL builds for, in the layout of zstd-jni.
#
#   every push                           builds and tests the platforms, and replaces the release `native`
#   a pull request                       builds and tests, publishes nothing
#
# What the builds take from the last release, at stable addresses:
#   https://github.com/AdHoc-Protocol/adhoc-crypto/releases/latest/download/adhoc-crypto.jar           Java, as zstd-jni
#   https://github.com/AdHoc-Protocol/adhoc-crypto/releases/latest/download/adhoc-crypto.zip   the other languages, <rid>/libadhoc-crypto-<version>.<ext>
#   https://github.com/AdHoc-Protocol/adhoc-crypto/releases/latest/download/AdHoc.Crypto.<version>.<run>.nupkg   C#, runtimes/<rid>/native/
#   https://github.com/AdHoc-Protocol/adhoc-crypto/releases/latest/download/SHA256SUMS.txt             what changed
#
# The registries take a push to main, each with its own secrets; with none of them the job is skipped and nothing is published:
#   nuget.org      NUGET_USER: the name of the account with a policy of Trusted Publishing for this repository and release.yml
#   Maven Central  MAVEN_CENTRAL_USER, MAVEN_CENTRAL_TOKEN: the user token of the Portal; GPG_PRIVATE_KEY, GPG_PASSPHRASE: what signs
# A version there is never replaced: <VERSION>.<number of the run>, and it stays for good.
#
# The platforms of zstd-jni that are not here have no BoringSSL: ppc64, ppc64le, s390x, loongarch64, aix, 32-bit freebsd.
# BoringSSL is the latest main at every run: versions are not pinned. The version of the library is VERSION: the languages name the file by it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built in the oldest images that still have the compiler BoringSSL asks for, so it loads on old systems too.
          - { os: linux, arch: amd64, runner: ubuntu-24.04, image: 'quay.io/pypa/manylinux_2_28_x86_64', test: 'host' }
          - { os: linux, arch: aarch64, runner: ubuntu-24.04-arm, image: 'quay.io/pypa/manylinux_2_28_aarch64', test: 'host' }
          - { os: linux-musl, arch: amd64, runner: ubuntu-24.04, image: 'alpine:latest', test: 'eclipse-temurin:25-jdk-alpine' }
          - { os: linux-musl, arch: aarch64, runner: ubuntu-24.04-arm, image: 'alpine:latest', test: 'eclipse-temurin:25-jdk-alpine' }
          # Under emulation, slowly, and only built: the runners have no JDK of these to load it in.
          - { os: linux, arch: i386, runner: ubuntu-24.04, image: 'quay.io/pypa/manylinux_2_28_i686', platform: 'linux/386', test: 'none' }
          - { os: linux, arch: arm, runner: ubuntu-24.04-arm, image: 'quay.io/pypa/manylinux_2_31_armv7l', platform: 'linux/arm/v7', test: 'none' }
          - { os: linux, arch: riscv64, runner: ubuntu-24.04, image: 'quay.io/pypa/manylinux_2_39_riscv64', platform: 'linux/riscv64', test: 'none' }
          - { os: win, arch: amd64, runner: windows-latest, test: 'host' }
          - { os: win, arch: aarch64, runner: windows-11-arm, java: 'microsoft', test: 'host' }
          - { os: win, arch: x86, runner: windows-latest, msvc: 'amd64_x86', test: 'none' }
          - { os: darwin, arch: aarch64, runner: macos-latest, test: 'host' }
          - { os: darwin, arch: x86_64, runner: macos-15-intel, test: 'host' }
          - { os: freebsd, arch: amd64, runner: ubuntu-24.04, test: 'none' }
          - { os: android, arch: arm64-v8a, runner: ubuntu-24.04, test: 'none' }
          - { os: android, arch: armeabi-v7a, runner: ubuntu-24.04, test: 'none' }
          - { os: android, arch: x86_64, runner: ubuntu-24.04, test: 'none' }
          - { os: android, arch: x86, runner: ubuntu-24.04, test: 'none' }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.java || 'temurin' }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Emulation
        if: matrix.platform
        uses: docker/setup-qemu-action@v4

      - name: Build in a container
        if: matrix.image
        run: |
          docker run --rm ${{ matrix.platform && format('--platform {0}', matrix.platform) || '' }} -v "$PWD:/w" -v "$JAVA_HOME:/jdk:ro" -e JAVA_HOME=/jdk -w /w '${{ matrix.image }}' sh -c '
            set -e
            if command -v apk >/dev/null; then apk add --no-cache bash build-base cmake git linux-headers ninja; fi
            if [ "${{ matrix.arch }}" = riscv64 ]; then dnf install -y --enablerepo=crb libstdc++-static || dnf install -y libstdc++-static || true; fi
            git config --global --add safe.directory "*"
            bash scripts/build.sh ${{ matrix.os }} ${{ matrix.arch }} '"$VERSION"'
            chown -R '"$(id -u):$(id -g)"' out
          '

      - name: Build on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash cmake ninja git gcc openjdk21
          run: JAVA_HOME=/usr/local/openjdk21 bash scripts/build.sh freebsd amd64 "$VERSION"
          envs: VERSION

      - name: Tools of Windows
        if: matrix.os == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc || (matrix.arch == 'aarch64' && 'arm64' || 'amd64') }}
      - name: NASM
        if: matrix.os == 'win'
        uses: ilammy/setup-nasm@v1
      - name: Build on Windows
        if: matrix.os == 'win'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          export JAVA_HOME=$(cygpath -m "$JAVA_HOME")
          WORK=$(cygpath -m "$PWD")/out/work bash scripts/build.sh win ${{ matrix.arch }} "$VERSION"

      - name: Build for Android
        if: matrix.os == 'android'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          ANDROID_NDK_ROOT=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT} bash scripts/build.sh android ${{ matrix.arch }} "$VERSION"

      - name: Build on macOS
        if: matrix.os == 'darwin'
        run: |
          brew install ninja
          bash scripts/build.sh darwin ${{ matrix.arch }} "$VERSION"

      - name: A jar of this platform alone
        if: matrix.os != 'android'
        shell: bash
        run: bash scripts/jar.sh "$VERSION"

      - name: Test on the runner
        if: matrix.test == 'host'
        shell: bash
        run: bash test/test.sh "out/adhoc-crypto-$VERSION.jar"

      - name: Test in a container
        if: matrix.test != 'host' && matrix.test != 'none'
        run: |
          docker run --rm -v "$PWD:/w" -w /w '${{ matrix.test }}' sh -c '
            apk add --no-cache bash
            JAVA_HOME=${JAVA_HOME:-/opt/java/openjdk} bash test/test.sh out/adhoc-crypto-'"$VERSION"'.jar
          '

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: out/natives
          retention-days: 7

  jar:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: out/natives
          pattern: native-*
          merge-multiple: true
      - name: The jar of all the platforms
        run: bash scripts/jar.sh "$VERSION"
      - name: It loads and works from the jar
        run: bash test/test.sh "out/adhoc-crypto-$VERSION.jar"
      - name: The folders of the other languages
        run: bash scripts/pack.sh
      - name: The aar of Android
        run: bash scripts/aar.sh "$VERSION"
      - name: The package of C#
        run: bash scripts/nupkg.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: A name that does not change
        run: |
          cp "out/adhoc-crypto-$VERSION.jar" out/adhoc-crypto.jar
          ( cd out && sha256sum adhoc-crypto.jar adhoc-crypto.aar adhoc-crypto.zip AdHoc.Crypto.*.nupkg > SHA256SUMS.txt && cat SHA256SUMS.txt )
      - uses: actions/upload-artifact@v7
        with:
          name: adhoc-crypto
          path: |
            out/adhoc-crypto.jar
            out/adhoc-crypto.aar
            out/adhoc-crypto.zip
            out/AdHoc.Crypto.*.nupkg
            out/SHA256SUMS.txt
          retention-days: 30

  release:
    if: github.event_name != 'pull_request'
    needs: jar
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may touch the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: adhoc-crypto
      - name: The release `native`, of this push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete native --cleanup-tag --yes || true
          gh release create native --target "$GITHUB_SHA" --latest --title "native $(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" --notes "BoringSSL latest main, $GITHUB_REF_NAME ${GITHUB_SHA}." adhoc-crypto.jar adhoc-crypto.aar adhoc-crypto.zip AdHoc.Crypto.*.nupkg SHA256SUMS.txt

  registries:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: jar
    runs-on: ubuntu-latest
    outputs:
      nuget: ${{ steps.have.outputs.nuget }}
      maven: ${{ steps.have.outputs.maven }}
    steps:
      - id: have
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          MAVEN_CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USER }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "nuget=$([ -n "$NUGET_USER" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "maven=$([ -n "$MAVEN_CENTRAL_USER" ] && [ -n "$MAVEN_CENTRAL_TOKEN" ] && [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

  nuget:
    needs: registries
    if: needs.registries.outputs.nuget == 'yes'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the short-lived key of Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: adhoc-crypto
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push AdHoc.Crypto.*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven:
    needs: [version, registries]
    if: needs.registries.outputs.maven == 'yes'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: adhoc-crypto
          path: out
      - name: The bundle, signed
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          cp out/adhoc-crypto.jar "out/adhoc-crypto-$VERSION.jar"
          bash scripts/maven.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Upload and wait for the verdict of the Portal
        env:
          MAVEN_CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USER }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          AUTH="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USER" "$MAVEN_CENTRAL_TOKEN" | base64 -w0)"
          BUNDLE="out/adhoc-crypto-$VERSION.$GITHUB_RUN_NUMBER-bundle.zip"
          ID=$(curl -fsS -H "$AUTH" -F "bundle=@$BUNDLE;type=application/octet-stream" "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC")
          echo "deployment $ID"
          for attempt in $(seq 1 90); do
            sleep 20
            STATUS=$(curl -fsS -X POST -H "$AUTH" "https://central.sonatype.com/api/v1/publisher/status?id=$ID")
            STATE=$(jq -r .deploymentState <<< "$STATUS")
            echo "$STATE"
            case $STATE in
              PUBLISHED | PUBLISHING) exit 0 ;;
              FAILED) jq . <<< "$STATUS"; exit 1 ;;
            esac
          done
          echo "no verdict of the Portal in 30 minutes: deployment $ID" >&2
          exit 1
